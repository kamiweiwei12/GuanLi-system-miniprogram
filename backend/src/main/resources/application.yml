server:
  port: 8080

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.inspection.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads}
  access-prefix: /uploads
  base-url: ${FILE_BASE_URL:http://localhost:8080}

logging:
  level:
    root: INFO
    com.inspection: DEBUG
